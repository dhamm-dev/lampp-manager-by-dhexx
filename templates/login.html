<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — LAMPP Manager</title>
<link rel="icon" type="image/png" href="/static/icons/favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .stack{display:grid}
  .pane{grid-area:1/1;min-width:0}
  .pane2{opacity:0;pointer-events:none}
  .stack.step2 .pane1{visibility:hidden}
  .stack.step2 .pane2{pointer-events:auto}
</style>
</head>
<body class="bg-stone-50 text-stone-900" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div id="slider" class="stack bg-white border border-stone-200 rounded-lg p-6">
      <!-- STEP 1: username -->
      <div class="pane pane1" id="pane1">
        <div class="shard flex items-center gap-2 mb-1" data-dx="-48px" data-dy="-30px" data-rr="-10deg">
          <div class="w-8 h-8 rounded overflow-hidden bg-stone-900 text-white flex items-center justify-center text-sm font-bold shrink-0 relative"><span>L</span><img src="/static/icons/logo.png" alt="" class="absolute inset-0 w-8 h-8 object-cover" onerror="this.remove()"></div>
          <div>
            <div class="text-sm font-semibold">LAMPP Manager</div>
            <div class="text-xs text-stone-500 font-mono">localhost:8888 • htdocs/</div>
          </div>
        </div>
        <p class="shard text-xs text-stone-500 mb-4" data-dx="44px" data-dy="-18px" data-rr="8deg">Siapa kamu?</p>
        <label class="shard text-xs font-medium block" data-dx="-36px" data-dy="22px" data-rr="-7deg">Username</label>
        <input id="u" class="shard mt-1 w-full border border-stone-200 rounded px-3 py-2 text-sm outline-none focus:border-stone-900" data-dx="0px" data-dy="38px" data-rr="0deg" placeholder="username" autocomplete="username" autofocus>
        <button id="nextBtn" class="shard mt-4 w-full bg-stone-900 text-white text-sm rounded py-2 hover:bg-stone-800" data-dx="0px" data-dy="46px" data-rr="0deg">Lanjut →</button>
        <p class="shard text-center text-[11px] text-stone-400 mt-3" data-dx="40px" data-dy="36px" data-rr="6deg">langkah 1 dari 2</p>
      </div>
      <!-- STEP 2: password -->
      <div class="pane pane2" id="pane2">
        <div class="flex items-center gap-2 mb-1">
          <button id="backBtn" title="Kembali" class="w-8 h-8 rounded border border-stone-200 flex items-center justify-center hover:border-stone-900 shrink-0">←</button>
          <div class="min-w-0">
            <div class="text-sm font-semibold truncate" id="whoLabel">…</div>
            <div class="text-xs text-stone-500 font-mono">masukkan password</div>
          </div>
        </div>
        <label class="text-xs font-medium mt-3 block">Password</label>
        <input id="p" type="password" class="mt-1 w-full border border-stone-200 rounded px-3 py-2 text-sm outline-none focus:border-stone-900" placeholder="••••••••" autocomplete="current-password">
        <div id="err" class="hidden text-xs text-red-600 mt-2"></div>
        <button id="btn" class="mt-4 w-full bg-stone-900 text-white text-sm rounded py-2 hover:bg-stone-800">Masuk</button>
        <p class="text-center text-[11px] text-stone-400 mt-3">langkah 2 dari 2 • Esc untuk kembali</p>
      </div>
    </div>
    <p class="text-center text-[11px] text-stone-400 mt-3">by dhexx • <a href="https://github.com/dhamm-dev" target="_blank" rel="noopener" class="hover:text-stone-900 underline">GitHub</a></p>
  </div>
</div>
<script>
const slider=document.getElementById('slider'),pane1=document.getElementById('pane1'),pane2=document.getElementById('pane2');
const u=document.getElementById('u'),p=document.getElementById('p'),err=document.getElementById('err'),who=document.getElementById('whoLabel');
const shards=[...pane1.querySelectorAll('.shard')];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const WAAPI=typeof Element!=='undefined'&&typeof document.body.animate==='function';
let busy=false,exiting=false,running=[];
function stopAll(){running.forEach(a=>{try{a.cancel();}catch(e){}});running=[];}
async function goPass(){
  if(!u.value.trim()){u.focus();return;}
  if(busy)return;
  who.textContent=u.value.trim();
  err.classList.add('hidden');
  stopAll();
  if(RM||!WAAPI){slider.classList.add('step2');pane2.style.opacity=1;pane2.style.transform='none';p.focus();return;}
  busy=true;
  const sh=shards.map((el,i)=>{
    const dx=el.dataset.dx||'0px',dy=el.dataset.dy||'12px',rr=el.dataset.rr||'0deg';
    return el.animate(
      [{transform:'translate(0px, 0px) rotate(0deg) scale(1)',opacity:1},
       {transform:`translate(calc(${dx} * 0.6), calc(${dy} * 0.6)) rotate(0deg) scale(.96)`,opacity:1,offset:.45},
       {transform:`translate(${dx}, ${dy}) rotate(${rr}) scale(.9)`,opacity:0}],
      {duration:380,delay:i*50,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
  });
  running.push(...sh);
  try{await Promise.all(sh.map(a=>a.finished));}
  catch(e){busy=false;return;}
  slider.classList.add('step2');
  const rise=pane2.animate(
    [{transform:'translateY(56px)',opacity:0},{transform:'translateY(0px)',opacity:1}],
    {duration:550,easing:'cubic-bezier(.22,.9,.24,1)',fill:'forwards'});
  running.push(rise);
  try{await rise.finished;}catch(e){busy=false;return;}
  try{rise.commitStyles();rise.cancel();}catch(e){}
  running=[];
  busy=false;
  setTimeout(()=>p.focus(),30);
}
async function goUser(){
  if(busy){stopAll();busy=false;}
  stopAll();
  err.classList.add('hidden');
  if(!RM&&WAAPI&&slider.classList.contains('step2')){
    const back=pane2.animate(
      [{transform:'translateY(0px)',opacity:1},{transform:'translateY(24px)',opacity:0}],
      {duration:180,easing:'ease-in',fill:'forwards'});
    try{await back.finished;}catch(e){}
    try{back.cancel();}catch(e){}
  }
  slider.classList.remove('step2');
  pane2.style.opacity='';pane2.style.transform='';
  setTimeout(()=>u.focus(),30);
}
async function login(){
  if(exiting)return;
  if(!p.value){p.focus();return;}
  err.classList.add('hidden');
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value.trim(),password:p.value})});
  if(!r.ok){const j=await r.json();err.textContent=j.error||'gagal';err.classList.remove('hidden');p.select();return;}
  exiting=true;
  if(RM||!WAAPI){location.href='/';return;}
  const wipe=document.createElement('div');
  wipe.style.cssText='position:fixed;inset:0;background:#1c1917;z-index:60;pointer-events:none;transform:translateY(100%)';
  document.body.appendChild(wipe);
  const cover=wipe.animate(
    [{transform:'translateY(100%)'},{transform:'translateY(0%)'}],
    {duration:450,easing:'cubic-bezier(.6,0,.2,1)',fill:'forwards'});
  try{await cover.finished;}catch(e){}
  try{sessionStorage.setItem('lm-enter','1');}catch(e){}
  location.href='/';
}
document.getElementById('nextBtn').onclick=goPass;
document.getElementById('backBtn').onclick=goUser;
document.getElementById('btn').onclick=login;
u.focus();
u.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();goPass();}});
p.addEventListener('keydown',e=>{if(e.key==='Enter')login();if(e.key==='Backspace'&&!p.value)goUser();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&slider.classList.contains('step2'))goUser();});
</script>
</body>
</html>
